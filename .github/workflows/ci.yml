name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Profile README exists and has no unresolved merge conflict
        run: |
          test -s README.md
          if grep -nE '^(<<<<<<< |=======|>>>>>>> )' README.md; then exit 1; fi
